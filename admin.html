<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de RRHH - VT VALETEC</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="icono-192.png">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 sm:p-6 overflow-y-auto">

    <div class="max-w-5xl mx-auto space-y-6">

        <!-- CABECERA CON NAVEGACIÓN -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-800/90 p-5 rounded-3xl shadow-xl border border-slate-700">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-blue-600/20 text-blue-400 rounded-2xl border border-blue-500/30">
                    <i data-lucide="users" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-white flex items-center gap-2">
                        <span>Panel de Personal</span>
                        <span class="text-xs px-2.5 py-0.5 rounded-full bg-blue-900/60 text-blue-400 border border-blue-800">RRHH</span>
                    </h1>
                    <p class="text-slate-400 text-xs sm:text-sm">Gestión de empleados, biometría y códigos PIN</p>
                </div>
            </div>

            <!-- BOTONES DE ACCESO RÁPIDO -->
            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all shadow active:scale-95">
                    <i data-lucide="scan-face" class="w-4 h-4 text-blue-400"></i>
                    Quiosco
                </a>
                <a href="reportes.html" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all shadow active:scale-95">
                    <i data-lucide="clipboard-list" class="w-4 h-4 text-emerald-400"></i>
                    Reportes
                </a>
            </div>
        </header>

        <!-- TABS DE NAVEGACIÓN INTERNA -->
        <div class="flex bg-slate-800/80 p-1.5 rounded-2xl border border-slate-700 max-w-md mx-auto">
            <button id="tab-registro" onclick="cambiarSeccion('registro')" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-blue-600 text-white shadow flex items-center justify-center gap-2">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                Nuevo Empleado
            </button>
            <button id="tab-lista" onclick="cambiarSeccion('lista')" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-2">
                <i data-lucide="list" class="w-4 h-4"></i>
                Lista de Empleados (<span id="contador-empleados">0</span>)
            </button>
        </div>

        <!-- SECCIÓN 1: FORMULARIO DE REGISTRO -->
        <section id="seccion-registro" class="max-w-xl mx-auto bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
            <div class="bg-slate-950/70 p-5 text-center border-b border-slate-700">
                <h2 class="text-lg font-bold text-white flex items-center justify-center gap-2">
                    <i data-lucide="scan" class="text-blue-400 w-5 h-5"></i>
                    Captura Biométrica y Credenciales
                </h2>
                <p class="text-slate-400 text-xs mt-0.5">Ingresa los datos del empleado y captura su rostro</p>
            </div>

            <div class="p-6">
                <form id="form-registro" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Nombre Completo</label>
                        <input type="text" id="nombre" required placeholder="Ej. Carlos Mendoza Ramos" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Código PIN (4 a 6 dígitos)</label>
                        <input type="password" id="pin" required pattern="[0-9]{4,6}" placeholder="****" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white tracking-widest focus:outline-none focus:border-blue-500 text-sm">
                    </div>

                    <div class="pt-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Escáner Facial</label>
                        <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border-2 border-dashed border-slate-600 flex items-center justify-center">
                            <video id="video-registro" class="absolute inset-0 w-full h-full object-cover hidden" autoplay muted playsinline></video>
                            
                            <div id="estado-camara" class="text-center z-10">
                                <i data-lucide="loader-2" class="w-8 h-8 text-blue-500 animate-spin mx-auto mb-2"></i>
                                <span id="texto-estado" class="text-xs text-slate-400">Cargando modelos de IA...</span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="btn-guardar" disabled class="w-full mt-2 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all active:scale-[0.98]">
                        <i data-lucide="scan-face" class="w-5 h-5"></i>
                        <span id="texto-btn">Esperando cámara...</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- SECCIÓN 2: LISTA DE EMPLEADOS -->
        <section id="seccion-lista" class="hidden bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
            <!-- Barra de Búsqueda y Filtros de Lista -->
            <div class="p-5 bg-slate-950/60 border-b border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="relative w-full sm:w-72">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="filtro-buscar" oninput="filtrarTablaEmpleados()" placeholder="Buscar por nombre..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="cargarListaEmpleados()" class="w-full sm:w-auto px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Actualizar
                </button>
            </div>

            <!-- Tabla de Empleados -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="p-4 border-b border-slate-700">ID</th>
                            <th class="p-4 border-b border-slate-700">Nombre Completo</th>
                            <th class="p-4 border-b border-slate-700">Registrado El</th>
                            <th class="p-4 border-b border-slate-700 text-center">Asistencias</th>
                            <th class="p-4 border-b border-slate-700 text-center">Estado</th>
                            <th class="p-4 border-b border-slate-700 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-empleados" class="text-sm divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-400">
                                <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-blue-500"></i>
                                Cargando empleados...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- TOAST NOTIFICACIÓN -->
    <div id="toast" class="hidden fixed bottom-6 right-6 max-w-sm p-4 rounded-2xl shadow-2xl border backdrop-blur-md z-50 flex items-center gap-3">
        <span id="toast-icono"></span>
        <span id="toast-mensaje" class="text-xs sm:text-sm font-medium"></span>
    </div>

    <script>
        lucide.createIcons();

        const video = document.getElementById('video-registro');
        const estadoCamara = document.getElementById('estado-camara');
        const textoEstado = document.getElementById('texto-estado');
        const btnGuardar = document.getElementById('btn-guardar');
        const textoBtn = document.getElementById('texto-btn');
        
        const MODEL_URL = 'https://vladmandic.github.io/face-api/model/';
        let iaLista = false;
        let listaEmpleadosAdmin = [];

        // 1. Alternar Pestañas
        function cambiarSeccion(seccion) {
            const tabRegistro = document.getElementById('tab-registro');
            const tabLista = document.getElementById('tab-lista');
            const secRegistro = document.getElementById('seccion-registro');
            const secLista = document.getElementById('seccion-lista');

            if (seccion === 'registro') {
                tabRegistro.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-blue-600 text-white shadow flex items-center justify-center gap-2";
                tabLista.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-2";
                secRegistro.classList.remove('hidden');
                secLista.classList.add('hidden');
            } else {
                tabLista.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-blue-600 text-white shadow flex items-center justify-center gap-2";
                tabRegistro.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-white flex items-center justify-center gap-2";
                secLista.classList.remove('hidden');
                secRegistro.classList.add('hidden');
                cargarListaEmpleados();
            }
            lucide.createIcons();
        }

        // 2. Cargar IA y Cámara
        async function inicializarAdmin() {
            try {
                textoEstado.textContent = "Cargando modelos de IA...";
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                textoEstado.textContent = "Encendiendo cámara...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.classList.remove('hidden');
                    estadoCamara.classList.add('hidden');
                    iaLista = true;
                    btnGuardar.disabled = false;
                    textoBtn.textContent = "Escanear Rostro y Guardar";
                };

            } catch (error) {
                console.error("Error:", error);
                textoEstado.textContent = "Error al iniciar cámara o IA.";
                textoEstado.classList.add('text-red-400');
            }

            cargarListaEmpleados();
        }

        // 3. Procesar Registro de Empleado
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!iaLista) return mostrarToast('error', 'La IA aún no está lista.');

            const nombre = document.getElementById('nombre').value.trim();
            const pin = document.getElementById('pin').value.trim();

            const btnOriginalText = textoBtn.textContent;
            btnGuardar.disabled = true;
            textoBtn.textContent = "Escaneando rostro...";

            try {
                const deteccion = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                                             .withFaceLandmarks()
                                             .withFaceDescriptor();

                if (!deteccion) {
                    mostrarToast('error', 'No se detectó ningún rostro. Ilumina tu rostro y mira al frente.');
                    btnGuardar.disabled = false;
                    textoBtn.textContent = btnOriginalText;
                    return;
                }

                const descriptorArray = Array.from(deteccion.descriptor);
                textoBtn.textContent = "Guardando en base de datos...";

                const respuesta = await fetch('/api/empleados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre_completo: nombre,
                        codigo_pin: pin,
                        face_descriptor: descriptorArray
                    })
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    mostrarToast('success', `Empleado ${resultado.empleado.nombre_completo} registrado con éxito.`);
                    document.getElementById('form-registro').reset();
                    cargarListaEmpleados();
                } else {
                    mostrarToast('error', `Error: ${resultado.error}`);
                }

            } catch (error) {
                mostrarToast('error', 'Error al guardar el empleado.');
            } finally {
                btnGuardar.disabled = false;
                textoBtn.textContent = btnOriginalText;
            }
        });

        // 4. Cargar Lista Administrativa de Empleados
        async function cargarListaEmpleados() {
            try {
                const respuesta = await fetch('/api/empleados/admin');
                if (!respuesta.ok) return;
                listaEmpleadosAdmin = await respuesta.json();
                document.getElementById('contador-empleados').textContent = listaEmpleadosAdmin.length;
                renderizarTablaEmpleados(listaEmpleadosAdmin);
            } catch (error) {
                console.error("Error al obtener empleados:", error);
            }
        }

        function renderizarTablaEmpleados(empleados) {
            const tbody = document.getElementById('tabla-empleados');
            tbody.innerHTML = '';

            if (empleados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">No hay empleados registrados en la base de datos.</td></tr>`;
                return;
            }

            empleados.forEach(emp => {
                const fecha = emp.creado_en ? new Date(emp.creado_en).toLocaleDateString('es-ES') : '-';
                const estadoBadge = emp.activo 
                    ? `<span class="px-2.5 py-1 rounded-full text-xs font-bold border border-emerald-800 bg-emerald-950 text-emerald-400">Activo</span>`
                    : `<span class="px-2.5 py-1 rounded-full text-xs font-bold border border-slate-700 bg-slate-800 text-slate-400">Inactivo</span>`;

                const btnToggle = emp.activo
                    ? `<button onclick="toggleEstadoEmpleado(${emp.id})" class="px-3 py-1.5 text-xs font-bold rounded-lg border border-red-800/40 bg-red-950/30 text-red-400 hover:bg-red-900/40 transition-colors">Desactivar</button>`
                    : `<button onclick="toggleEstadoEmpleado(${emp.id})" class="px-3 py-1.5 text-xs font-bold rounded-lg border border-emerald-800/40 bg-emerald-950/30 text-emerald-400 hover:bg-emerald-900/40 transition-colors">Activar</button>`;

                const fila = `
                    <tr class="hover:bg-slate-750 transition-colors">
                        <td class="p-4 text-slate-400">#${emp.id}</td>
                        <td class="p-4 font-bold text-white">${emp.nombre_completo}</td>
                        <td class="p-4 text-slate-300 text-xs">${fecha}</td>
                        <td class="p-4 text-center font-mono text-amber-400 font-bold">${emp.total_asistencias}</td>
                        <td class="p-4 text-center">${estadoBadge}</td>
                        <td class="p-4 text-center">${btnToggle}</td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
            lucide.createIcons();
        }

        // 5. Alternar Estado Activo / Inactivo
        async function toggleEstadoEmpleado(id) {
            try {
                const respuesta = await fetch(`/api/empleados/${id}/toggle`, { method: 'PATCH' });
                const resultado = await respuesta.json();
                if (respuesta.ok) {
                    mostrarToast('success', resultado.mensaje);
                    cargarListaEmpleados();
                } else {
                    mostrarToast('error', resultado.error || 'No se pudo cambiar el estado');
                }
            } catch (error) {
                mostrarToast('error', 'Error al comunicar con el servidor');
            }
        }

        // 6. Buscador Rápido en la Tabla
        function filtrarTablaEmpleados() {
            const query = document.getElementById('filtro-buscar').value.toLowerCase();
            const filtrados = listaEmpleadosAdmin.filter(emp => 
                emp.nombre_completo.toLowerCase().includes(query) || emp.id.toString().includes(query)
            );
            renderizarTablaEmpleados(filtrados);
        }

        // Toast de notificación
        function mostrarToast(tipo, mensaje) {
            const toast = document.getElementById('toast');
            const icono = document.getElementById('toast-icono');
            const texto = document.getElementById('toast-mensaje');

            if (tipo === 'success') {
                toast.className = "fixed bottom-6 right-6 max-w-sm p-4 rounded-2xl shadow-2xl border border-emerald-500/50 bg-slate-900/95 text-emerald-300 z-50 flex items-center gap-3";
                icono.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>';
            } else {
                toast.className = "fixed bottom-6 right-6 max-w-sm p-4 rounded-2xl shadow-2xl border border-rose-500/50 bg-slate-900/95 text-rose-300 z-50 flex items-center gap-3";
                icono.innerHTML = '<i data-lucide="alert-circle" class="w-5 h-5 text-rose-400"></i>';
            }
            texto.textContent = mensaje;
            lucide.createIcons();

            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        window.addEventListener('load', inicializarAdmin);
    </script>
</body>
</html>
