# 1. Subdominio de Gestión y Recursos Humanos (registro.valetec.pe)
server {
    listen 80;
    server_name registro.valetec.pe;

    root /usr/share/nginx/html;
    index registro.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /registro.html;
    }

    # Redireccionar páginas preliminares antiguas hacia la maqueta oficial consolidada
    location = /reportes.html {
        return 301 /registro.html;
    }

    location = /admin.html {
        return 301 /registro.html;
    }

    # La raíz siempre abre el panel de control (registro.html)
    location = / {
        try_files /registro.html =404;
    }

    location / {
        try_files $uri $uri/ /registro.html;
    }

    location /api/ {
        proxy_pass http://asistencia-backend:3008/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Servidor por defecto (asistencia.valetec.pe, localhost o IP directa)
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    location = /reportes.html {
        return 301 /registro.html;
    }

    location = /admin.html {
        return 301 /registro.html;
    }

    # La raíz por defecto abre la Terminal de Marcación (index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://asistencia-backend:3008/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
