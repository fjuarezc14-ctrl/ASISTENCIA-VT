<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT VALETEC - Control de Asistencia con IA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="icono-192.png">

    <style>
        #canvas-ia { position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; }
        #video-camara { z-index: 0; }
        .z-guia { z-index: 20; } 
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col justify-between overflow-hidden p-6 select-none">

    <header class="text-center my-2 flex flex-col items-center">
        <div class="text-4xl tracking-tighter mb-3 flex gap-2 items-center justify-center">
            <span class="text-blue-500 font-black">VT</span>
            <span class="text-white font-black">VALETEC</span>
        </div>
        <div id="reloj" class="text-4xl font-black text-amber-400 my-1 font-mono tracking-widest">00:00:00</div>
        <div id="fecha" class="text-sm text-slate-400 uppercase tracking-wider font-medium">Cargando fecha...</div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center my-4 w-full max-w-md mx-auto relative">
        
        <div class="flex bg-slate-800 p-1 rounded-2xl w-full mb-5 relative z-guia shadow-inner border border-slate-700">
            <button id="btn-ingreso" onclick="setTipoMarcacion('INGRESO')" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-blue-600 text-white shadow-md">
                INGRESO
            </button>
            <button id="btn-salida" onclick="setTipoMarcacion('SALIDA')" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-white">
                SALIDA
            </button>
        </div>

        <div id="contenedor-rostro" class="w-full aspect-square bg-slate-950 rounded-3xl border-4 border-slate-800 relative flex flex-col items-center justify-center overflow-hidden shadow-2xl transition-all duration-300">
            <video id="video-camara" class="absolute inset-0 w-full h-full object-cover" autoplay muted playsinline></video>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent z-10"></div>
            
            <div id="icono-carga" class="z-20 flex flex-col items-center p-4 rounded-full bg-slate-950/60 backdrop-blur-sm">
                <i data-lucide="loader-2" class="w-12 h-12 text-blue-500 animate-spin mb-2"></i>
                <span id="texto-carga" class="text-xs text-slate-400">Iniciando IA...</span>
            </div>

            <div class="absolute z-guia border-[3px] border-dashed border-blue-500/70 w-2/3 h-3/4 rounded-[50%] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-[0_0_0_9999px_rgba(15,23,42,0.5)] transition-colors duration-300" id="ovalo-guia"></div>
            
            <p id="mensaje-rostro" class="absolute bottom-6 left-0 right-0 text-center text-sm font-semibold tracking-wide text-white z-guia px-4 drop-shadow-md transition-colors duration-300">
                Esperando inicialización...
            </p>
        </div>

        <div id="contenedor-pin" class="hidden w-full flex flex-col items-center transition-all duration-300">
            <p class="text-slate-400 text-sm mb-4">Ingresa tu código de 4 dígitos</p>
            <div class="flex gap-6 mb-6">
                <div class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700 dot-pin transition-all duration-200"></div>
                <div class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700 dot-pin transition-all duration-200"></div>
                <div class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700 dot-pin transition-all duration-200"></div>
                <div class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700 dot-pin transition-all duration-200"></div>
            </div>
            
            <div class="grid grid-cols-3 gap-4 w-full px-2">
                <button onclick="presionarPIN('1')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">1</button>
                <button onclick="presionarPIN('2')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">2</button>
                <button onclick="presionarPIN('3')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">3</button>
                <button onclick="presionarPIN('4')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">4</button>
                <button onclick="presionarPIN('5')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">5</button>
                <button onclick="presionarPIN('6')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">6</button>
                <button onclick="presionarPIN('7')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">7</button>
                <button onclick="presionarPIN('8')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">8</button>
                <button onclick="presionarPIN('9')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">9</button>
                <button onclick="borrarPIN()" class="bg-red-950/40 text-red-400 text-xl font-bold py-4 rounded-2xl border border-red-900/30 flex items-center justify-center"><i data-lucide="delete"></i></button>
                <button onclick="presionarPIN('0')" class="bg-slate-800 active:bg-slate-700 text-2xl font-bold py-4 rounded-2xl shadow-md border border-slate-700/50">0</button>
                <button onclick="limpiarPIN()" class="bg-slate-900 text-slate-500 text-sm font-bold py-4 rounded-2xl border border-slate-800 flex items-center justify-center uppercase tracking-wider">Borrar</button>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-md mx-auto mb-2 relative z-guia">
        <button id="btn-cambiar" onclick="alternarMetodo()" disabled class="w-full bg-slate-700 text-slate-400 font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 border border-slate-600 shadow-lg opacity-60 transition-all active:scale-[0.98]">
            <i id="icono-btn" data-lucide="keyboard"></i>
            <span id="texto-btn">Cargando Sistema...</span>
        </button>
    </footer>

    <script>
        lucide.createIcons();

        // Reloj
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').textContent = ahora.toLocaleTimeString('es-ES', { hour12: false });
            document.getElementById('fecha').textContent = ahora.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // =====================================
        // NUEVA LÓGICA: INGRESO / SALIDA
        // =====================================
        let tipoMarcacionActual = 'INGRESO';

        function setTipoMarcacion(tipo) {
            tipoMarcacionActual = tipo;
            const btnIngreso = document.getElementById('btn-ingreso');
            const btnSalida = document.getElementById('btn-salida');

            if (tipo === 'INGRESO') {
                btnIngreso.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-blue-600 text-white shadow-md";
                btnSalida.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-white";
                document.getElementById('ovalo-guia').classList.replace('border-red-500/70', 'border-blue-500/70');
            } else {
                btnSalida.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-red-600 text-white shadow-md";
                btnIngreso.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-white";
                document.getElementById('ovalo-guia').classList.replace('border-blue-500/70', 'border-red-500/70');
            }
        }

        const video = document.getElementById('video-camara');
        const MODEL_URL = 'https://vladmandic.github.io/face-api/model/';
        
        let streamCamara = null;
        let canvasIA = null;
        let intervalDetection = null;
        let modelsLoaded = false;
        
        let listaEmpleados = [];
        let faceMatcher = null;
        let marcacionEnProceso = false;

        async function descargarEmpleados() {
            try {
                const respuesta = await fetch('https://asistencia.valetec.pe/api/empleados');
                listaEmpleados = await respuesta.json();
                prepararReconocedor();
            } catch (error) {
                console.error("❌ Error conectando al servidor Backend:", error);
            }
        }

        function prepararReconocedor() {
            const descriptoresValidos = listaEmpleados.map(emp => {
                let desc = typeof emp.face_descriptor === 'string' ? JSON.parse(emp.face_descriptor) : emp.face_descriptor;
                if (Array.isArray(desc) && desc.length === 128) {
                    return new faceapi.LabeledFaceDescriptors(emp.id.toString(), [new Float32Array(desc)]);
                }
                return null;
            }).filter(d => d !== null);

            if (descriptoresValidos.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(descriptoresValidos, 0.5); 
            }
        }

        async function encenderCamara() {
            try {
                streamCamara = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 720 } }
                });
                video.srcObject = streamCamara;
            } catch (error) {
                document.getElementById('texto-carga').textContent = "Cámara bloqueada o no encontrada";
            }
        }

        function apagarCamara() {
            if (streamCamara) {
                streamCamara.getTracks().forEach(track => track.stop());
                streamCamara = null;
            }
        }

        async function cargarModelosYIniciar() {
            const textoCarga = document.getElementById('texto-carga');
            try {
                textoCarga.textContent = "Cargando modelos...";
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                modelsLoaded = true;
                textoCarga.textContent = "IA Lista. Encendiendo cámara...";
                
                await encenderCamara();
                habilitarBotonAlternar(true);
            } catch (error) {
                textoCarga.textContent = "Error cargando IA de red";
            }
        }

        async function iniciarDeteccionRostros() {
            if (!modelsLoaded) return;

            if (!canvasIA) {
                canvasIA = faceapi.createCanvasFromMedia(video);
                canvasIA.id = "canvas-ia";
                document.getElementById('contenedor-rostro').appendChild(canvasIA);
            }
            
            const iconoCarga = document.getElementById('icono-carga');
            const ovalo = document.getElementById('ovalo-guia');
            const mensajeRostro = document.getElementById('mensaje-rostro');
            const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
            faceapi.matchDimensions(canvasIA, displaySize);

            intervalDetection = setInterval(async () => {
                if (marcacionEnProceso) return; 

                const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
                const result = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();

                canvasIA.getContext('2d').clearRect(0, 0, canvasIA.width, canvasIA.height);

                if (result) {
                    if (!iconoCarga.classList.contains('hidden')) iconoCarga.classList.add('hidden');

                    const resizedResult = faceapi.resizeResults(result, displaySize);
                    
                    // Cambia el color de la caja según si es ingreso (azul) o salida (rojo)
                    const colorDeteccion = tipoMarcacionActual === 'INGRESO' ? '#3b82f6' : '#ef4444';
                    faceapi.draw.drawDetections(canvasIA, resizedResult, { withScore: false, color: colorDeteccion });
                    faceapi.draw.drawFaceLandmarks(canvasIA, resizedResult, { color: '#ffffff', lineWidth: 1 });

                    const box = result.detection.box;
                    const centerRostroX = box.x + box.width / 2;
                    const centerRostroY = box.y + box.height / 2;
                    const centerIdealeX = video.videoWidth / 2;
                    const centerIdealeY = video.videoHeight / 2;
                    const distToleranceX = video.videoWidth * 0.15; 
                    const distToleranceY = video.videoHeight * 0.15;

                    const estaCentrado = Math.abs(centerRostroX - centerIdealeX) < distToleranceX &&
                                         Math.abs(centerRostroY - centerIdealeY) < distToleranceY &&
                                         box.width > video.videoWidth * 0.4; 

                    if (estaCentrado) {
                        ovalo.classList.replace('border-blue-500/70', 'border-green-500');
                        ovalo.classList.replace('border-red-500/70', 'border-green-500');
                        mensajeRostro.classList.add('text-green-300');

                        if (faceMatcher) {
                            const coincidencia = faceMatcher.findBestMatch(result.descriptor);
                            if (coincidencia.label !== "unknown") {
                                registrarAsistenciaRostro(coincidencia.label);
                                mensajeRostro.textContent = `¡Rostro Reconocido! Guardando ${tipoMarcacionActual}...`;
                            } else {
                                mensajeRostro.textContent = "Rostro no registrado en base de datos.";
                            }
                        } else {
                            mensajeRostro.textContent = "¡Rostro centrado! (Falta base de datos)";
                        }

                    } else {
                        ovalo.classList.remove('border-green-500');
                        if(tipoMarcacionActual === 'INGRESO') ovalo.classList.add('border-blue-500/70');
                        else ovalo.classList.add('border-red-500/70');
                        
                        mensajeRostro.textContent = "Centra tu rostro en el óvalo";
                        mensajeRostro.classList.remove('text-green-300');
                    }
                } else {
                    ovalo.classList.remove('border-green-500');
                    mensajeRostro.textContent = "Buscando rostro... Asegúrate que haya luz";
                    mensajeRostro.classList.remove('text-green-300');
                }
            }, 200); 
        }

        function detenerDeteccionRostros() {
            if (intervalDetection) {
                clearInterval(intervalDetection);
                intervalDetection = null;
            }
            if (canvasIA) {
                canvasIA.getContext('2d').clearRect(0, 0, canvasIA.width, canvasIA.height);
            }
        }

        video.addEventListener('play', iniciarDeteccionRostros);

        window.addEventListener('load', async () => {
            await descargarEmpleados();    
            await cargarModelosYIniciar(); 
        });

        // Backend (ROSTRO)
        async function registrarAsistenciaRostro(empleadoId) {
            marcacionEnProceso = true; 
            
            try {
                const respuesta = await fetch('https://asistencia.valetec.pe/api/asistencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ empleado_id: empleadoId, metodo: 'ROSTRO', tipo: tipoMarcacionActual })
                });

                const resultado = await respuesta.json();
                if (respuesta.ok) {
                    alert(`🤖 ¡${resultado.tipo} Registrado!\n${resultado.nombre}`);
                }
            } catch (error) {
                console.error("Error:", error);
            }

            setTimeout(() => {
                marcacionEnProceso = false;
                // Restaurar color del óvalo
                const ovalo = document.getElementById('ovalo-guia');
                ovalo.classList.remove('border-green-500');
                if(tipoMarcacionActual === 'INGRESO') ovalo.classList.add('border-blue-500/70');
                else ovalo.classList.add('border-red-500/70');
            }, 4000); 
        }

        let modoActual = 'rostro';

        function habilitarBotonAlternar(habilitar) {
            const btnCambiar = document.getElementById('btn-cambiar');
            const textoBtn = document.getElementById('texto-btn');
            if (habilitar) {
                btnCambiar.disabled = false;
                btnCambiar.className = "w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 border border-blue-500 shadow-lg shadow-blue-900/20 transition-all active:scale-[0.98]";
                textoBtn.textContent = 'Usar Código PIN';
            }
        }

        function alternarMetodo() {
            const contenedorRostro = document.getElementById('contenedor-rostro');
            const contenedorPin = document.getElementById('contenedor-pin');
            const textoBtn = document.getElementById('texto-btn');
            const iconoBtn = document.getElementById('icono-btn');
            const btnCambiar = document.getElementById('btn-cambiar');
            
            if (modoActual === 'rostro') {
                detenerDeteccionRostros();
                apagarCamara();
                contenedorRostro.classList.add('hidden');
                contenedorPin.classList.remove('hidden');
                textoBtn.textContent = 'Usar Reconocimiento Facial';
                iconoBtn.setAttribute('data-lucide', 'scan-face');
                btnCambiar.className = "w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 border border-slate-700 shadow-lg transition-all active:scale-[0.98]";
                modoActual = 'pin';
            } else {
                contenedorRostro.classList.remove('hidden');
                contenedorPin.classList.add('hidden');
                document.getElementById('icono-carga').classList.remove('hidden');
                encenderCamara(); 
                
                textoBtn.textContent = 'Usar Código PIN';
                iconoBtn.setAttribute('data-lucide', 'keyboard');
                btnCambiar.className = "w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 border border-blue-500 shadow-lg shadow-blue-900/20 transition-all active:scale-[0.98]";
                modoActual = 'rostro';
                limpiarPIN();
            }
            lucide.createIcons();
        }

        // Lógica PIN Backend
        let pinIngresado = "";
        
        function presionarPIN(numero) {
            if (pinIngresado.length < 4) {
                pinIngresado += numero;
                actualizarPuntosPIN();
                if (pinIngresado.length === 4) {
                    procesarMarcacionPIN();
                }
            }
        }

        async function procesarMarcacionPIN() {
            const empleado = listaEmpleados.find(emp => emp.codigo_pin === pinIngresado);

            if (!empleado) {
                alert("❌ PIN incorrecto.");
                limpiarPIN();
                return;
            }

            try {
                const respuesta = await fetch('https://asistencia.valetec.pe/api/asistencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ empleado_id: empleado.id, metodo: 'PIN', tipo: tipoMarcacionActual })
                });

                const resultado = await respuesta.json();
                if (respuesta.ok) {
                    alert(`✅ ¡${resultado.tipo} registrado!\n${resultado.nombre}`);
                } 
            } catch (error) {
                alert("❌ Error de servidor.");
            }
            limpiarPIN();
        }

        function borrarPIN() { pinIngresado = pinIngresado.slice(0, -1); actualizarPuntosPIN(); }
        function limpiarPIN() { pinIngresado = ""; actualizarPuntosPIN(); }

        function actualizarPuntosPIN() {
            const puntos = document.querySelectorAll('.dot-pin');
            puntos.forEach((punto, index) => {
                if (index < pinIngresado.length) {
                    punto.classList.remove('bg-slate-800', 'border-slate-700');
                    punto.classList.add('bg-blue-500', 'border-blue-400', 'scale-125', 'shadow-[0_0_10px_rgba(59,130,246,0.8)]');
                } else {
                    punto.classList.remove('bg-blue-500', 'border-blue-400', 'scale-125', 'shadow-[0_0_10px_rgba(59,130,246,0.8)]');
                    punto.classList.add('bg-slate-800', 'border-slate-700');
                }
            });
        }
    </script>
</body>
</html>
