<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT VALETEC - Control de Asistencia</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="icono-192.png">

    <style>
        #canvas-ia { position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; transform: scaleX(-1); -webkit-transform: scaleX(-1); }
        #video-camara { z-index: 0; transform: scaleX(-1); -webkit-transform: scaleX(-1); }
        .z-guia { z-index: 20; }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .anim-pop { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col justify-between overflow-hidden p-4 sm:p-6 select-none relative">

    <!-- ACCESO DIRECTO AL PANEL DE ADMINISTRACIÓN -->
    <a href="registro.html" class="absolute top-3 sm:top-5 right-3 sm:right-6 flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-750 text-slate-300 hover:text-white text-xs font-bold border border-slate-700/80 shadow-md backdrop-blur-md transition-all active:scale-95 z-30" title="Regresar al Panel de Gestión">
        <i data-lucide="layout-dashboard" class="w-4 h-4 text-blue-400"></i>
        <span class="hidden sm:inline">Panel de Control</span>
    </a>

    <!-- CABECERA PRINCIPAL -->
    <header class="text-center my-1 sm:my-2 flex flex-col items-center shrink-0">
        <div class="text-3xl sm:text-4xl tracking-tighter mb-1 flex gap-2 items-center justify-center">
            <span class="text-blue-500 font-black">VT</span>
            <span class="text-white font-black">VALETEC</span>
        </div>
        <div id="reloj" class="text-3xl sm:text-4xl font-black text-amber-400 my-1 font-mono tracking-widest">00:00:00</div>
        <div id="fecha" class="text-xs sm:text-sm text-slate-400 uppercase tracking-wider font-medium">Cargando fecha...</div>
    </header>

    <!-- ÁREA PRINCIPAL: FLUJO PASO A PASO (1. INGRESO/SALIDA -> 2. MÉTODO -> 3. CÁMARA O PIN) -->
    <main class="flex-1 flex flex-col items-center justify-center w-full max-w-md mx-auto relative my-2 px-2">
        
        <!-- ======================================================== -->
        <!-- PASO 1: ¿QUÉ DESEAS REGISTRAR? (INGRESO / SALIDA)         -->
        <!-- ======================================================== -->
        <div id="paso-1-tipo" class="w-full flex flex-col items-center gap-5 anim-pop">
            <h2 class="text-base sm:text-lg text-center font-bold text-slate-300">¿Qué deseas registrar?</h2>
            
            <div class="w-full flex flex-col gap-4">
                <!-- BOTÓN INGRESO -->
                <button onclick="seleccionarTipo('INGRESO')" class="w-full bg-slate-800/90 hover:bg-slate-750 text-white font-black py-8 px-6 rounded-3xl shadow-xl border-2 border-sky-400/80 hover:border-sky-400 flex flex-col items-center justify-center gap-3 transition-all active:scale-95 group">
                    <div class="p-3 rounded-2xl bg-sky-500/10 text-sky-400 group-hover:scale-110 transition-transform">
                        <i data-lucide="log-in" class="w-12 h-12"></i>
                    </div>
                    <span class="text-2xl sm:text-3xl tracking-widest font-black text-white">INGRESO</span>
                </button>

                <!-- BOTÓN SALIDA -->
                <button onclick="seleccionarTipo('SALIDA')" class="w-full bg-slate-800/90 hover:bg-slate-750 text-white font-black py-8 px-6 rounded-3xl shadow-xl border-2 border-rose-500/80 hover:border-rose-500 flex flex-col items-center justify-center gap-3 transition-all active:scale-95 group">
                    <div class="p-3 rounded-2xl bg-rose-500/10 text-rose-400 group-hover:scale-110 transition-transform">
                        <i data-lucide="log-out" class="w-12 h-12"></i>
                    </div>
                    <span class="text-2xl sm:text-3xl tracking-widest font-black text-white">SALIDA</span>
                </button>
            </div>
        </div>

        <!-- ======================================================== -->
        <!-- PASO 2: SELECCIONA EL MÉTODO (FACIAL / PIN)               -->
        <!-- ======================================================== -->
        <div id="paso-2-metodo" class="hidden w-full flex flex-col items-center gap-5 anim-pop">
            <h2 class="text-base sm:text-lg text-center font-bold text-slate-300">Selecciona el método</h2>
            
            <div class="w-full flex flex-col gap-4">
                <!-- BOTÓN RECONOCIMIENTO FACIAL -->
                <button onclick="seleccionarMetodo('ROSTRO')" class="w-full bg-slate-800/90 hover:bg-slate-750 text-white font-bold py-7 px-6 rounded-3xl shadow-xl border border-slate-700/80 hover:border-blue-400/60 flex flex-col items-center justify-center gap-3 transition-all active:scale-95 group">
                    <i data-lucide="scan-face" class="w-12 h-12 text-blue-400 group-hover:scale-110 transition-transform"></i>
                    <span class="text-lg sm:text-xl tracking-wide font-black">RECONOCIMIENTO FACIAL</span>
                </button>

                <!-- BOTÓN CÓDIGO PIN -->
                <button onclick="seleccionarMetodo('PIN')" class="w-full bg-slate-800/90 hover:bg-slate-750 text-white font-bold py-7 px-6 rounded-3xl shadow-xl border border-slate-700/80 hover:border-emerald-400/60 flex flex-col items-center justify-center gap-3 transition-all active:scale-95 group">
                    <i data-lucide="keyboard" class="w-12 h-12 text-emerald-400 group-hover:scale-110 transition-transform"></i>
                    <span class="text-lg sm:text-xl tracking-wide font-black">CÓDIGO PIN</span>
                </button>
            </div>

            <!-- BOTÓN VOLVER -->
            <button onclick="volverPaso(1)" class="text-slate-400 hover:text-white flex items-center justify-center gap-2 py-3 px-6 rounded-xl hover:bg-slate-800/60 transition text-sm font-semibold active:scale-95">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
            </button>
        </div>

        <!-- ======================================================== -->
        <!-- PASO 3: ACCIÓN (CÁMARA O TECLADO PIN)                    -->
        <!-- ======================================================== -->
        <div id="paso-3-accion" class="hidden w-full flex flex-col items-center anim-pop">
            <!-- TÍTULO DINÁMICO (EJ: INGRESO POR RECONOCIMIENTO / SALIDA POR PIN) -->
            <h2 id="titulo-accion" class="text-lg sm:text-xl text-center font-black mb-3 tracking-wider uppercase"></h2>

            <!-- MÓDULO A: RECONOCIMIENTO FACIAL -->
            <div id="contenedor-rostro" class="hidden w-full aspect-square max-h-[350px] bg-slate-950 rounded-3xl border-4 border-slate-800 relative flex flex-col items-center justify-center overflow-hidden shadow-2xl transition-all duration-300">
                <!-- BOTÓN MODO ESPEJO (MOVIMIENTO NATURAL) -->
                <button type="button" id="btn-toggle-espejo" onclick="toggleModoEspejo()" class="absolute top-3 right-3 z-30 p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-blue-400 border border-slate-700/60 shadow backdrop-blur-sm transition-all active:scale-95 text-xs flex items-center gap-1.5" title="Modo espejo (Dirección natural de movimiento)">
                    <i data-lucide="flip-horizontal" class="w-4 h-4"></i>
                    <span class="text-[11px] font-medium hidden sm:inline">Espejo</span>
                </button>

                <video id="video-camara" class="absolute inset-0 w-full h-full object-cover" autoplay muted playsinline></video>
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent z-10"></div>
                
                <div id="icono-carga" class="z-20 flex flex-col items-center p-4 rounded-2xl bg-slate-950/70 backdrop-blur-sm border border-slate-800">
                    <i data-lucide="loader-2" class="w-10 h-10 text-blue-500 animate-spin mb-2"></i>
                    <span id="texto-carga" class="text-xs text-slate-300 font-medium">Encendiendo cámara...</span>
                </div>

                <div class="absolute z-guia border-[3px] border-dashed border-blue-500/70 w-2/3 h-3/4 rounded-[50%] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-[0_0_0_9999px_rgba(15,23,42,0.55)] transition-colors duration-300" id="ovalo-guia"></div>
                
                <p id="mensaje-rostro" class="absolute bottom-4 left-0 right-0 text-center text-xs sm:text-sm font-semibold tracking-wide text-white z-guia px-4 drop-shadow transition-colors duration-300">
                    Esperando inicialización...
                </p>
            </div>

            <!-- MÓDULO B: TECLADO PIN -->
            <div id="contenedor-pin" class="hidden w-full flex flex-col items-center">
                <p class="text-slate-400 text-xs sm:text-sm mb-3 font-medium">Ingresa tu código de 4 dígitos</p>
                
                <div class="flex gap-5 mb-4">
                    <div class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700 dot-pin transition-all duration-200"></div>
                    <div class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700 dot-pin transition-all duration-200"></div>
                    <div class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700 dot-pin transition-all duration-200"></div>
                    <div class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700 dot-pin transition-all duration-200"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-3 w-full px-1">
                    <button onclick="presionarPIN('1')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">1</button>
                    <button onclick="presionarPIN('2')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">2</button>
                    <button onclick="presionarPIN('3')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">3</button>
                    <button onclick="presionarPIN('4')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">4</button>
                    <button onclick="presionarPIN('5')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">5</button>
                    <button onclick="presionarPIN('6')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">6</button>
                    <button onclick="presionarPIN('7')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">7</button>
                    <button onclick="presionarPIN('8')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">8</button>
                    <button onclick="presionarPIN('9')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">9</button>
                    <button onclick="borrarPIN()" class="bg-red-950/50 hover:bg-red-900/60 text-red-400 text-xl font-bold py-3.5 rounded-2xl border border-red-900/50 flex items-center justify-center transition-transform active:scale-95"><i data-lucide="delete"></i></button>
                    <button onclick="presionarPIN('0')" class="bg-slate-800 hover:bg-slate-750 active:bg-slate-700 text-2xl font-bold py-3.5 rounded-2xl shadow-md border border-slate-700/60 transition-transform active:scale-95">0</button>
                    <button onclick="limpiarPIN()" class="bg-slate-900 hover:bg-slate-850 text-slate-400 hover:text-slate-200 text-xs font-bold py-3.5 rounded-2xl border border-slate-800 flex items-center justify-center uppercase tracking-wider transition-transform active:scale-95">BORRAR</button>
                </div>
            </div>

            <!-- BOTÓN CANCELAR -->
            <button onclick="reiniciarFlujo()" class="mt-5 w-full bg-slate-800/90 hover:bg-slate-750 text-slate-300 hover:text-white font-semibold py-3.5 rounded-2xl border border-slate-700 flex items-center justify-center gap-2 transition active:scale-95 text-sm">
                <i data-lucide="x-circle" class="w-4 h-4"></i> Cancelar
            </button>
        </div>

        <!-- 5. TOAST / NOTIFICACIÓN FLOTANTE ELEGANTE -->
        <div id="toast-notificacion" class="hidden fixed inset-x-4 top-6 max-w-sm mx-auto z-50 p-4 rounded-2xl border shadow-2xl backdrop-blur-md anim-pop flex items-start gap-3">
            <div id="toast-icono" class="p-2 rounded-xl shrink-0"></div>
            <div class="flex-1 min-w-0">
                <h4 id="toast-titulo" class="font-bold text-sm"></h4>
                <p id="toast-mensaje" class="text-xs text-slate-300 mt-0.5 leading-relaxed"></p>
            </div>
        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="w-full max-w-md mx-auto py-2 text-center text-xs text-slate-500 shrink-0 flex items-center justify-center gap-2">
        <span>VT Valetec &bull; Sistema Biométrico &bull; Versión 2.0</span>
        <span>&bull;</span>
        <a href="registro.html" class="text-blue-400 hover:text-blue-300 transition-colors font-medium">Volver al Panel</a>
    </footer>

    <script>
        lucide.createIcons();

        // =====================================
        // URL DE API RELATIVA INTELIGENTE
        // =====================================
        const API_BASE = '/api';

        // =====================================
        // RELOJ EN TIEMPO REAL
        // =====================================
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').textContent = ahora.toLocaleTimeString('es-ES', { hour12: false });
            document.getElementById('fecha').textContent = ahora.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // =====================================
        // LÓGICA DE FLUJO PASO A PASO
        // =====================================
        let tipoMarcacionActual = 'INGRESO'; // 'INGRESO' o 'SALIDA'
        let metodoActual = '';               // 'ROSTRO' o 'PIN'
        let marcacionEnProceso = false;

        function seleccionarTipo(tipo) {
            tipoMarcacionActual = tipo;
            document.getElementById('paso-1-tipo').classList.add('hidden');
            document.getElementById('paso-2-metodo').classList.remove('hidden');
            document.getElementById('paso-3-accion').classList.add('hidden');
            lucide.createIcons();
        }

        function volverPaso(paso) {
            detenerDeteccionRostros();
            apagarCamara();
            limpiarPIN();

            if (paso === 1) {
                document.getElementById('paso-1-tipo').classList.remove('hidden');
                document.getElementById('paso-2-metodo').classList.add('hidden');
                document.getElementById('paso-3-accion').classList.add('hidden');
            } else if (paso === 2) {
                document.getElementById('paso-1-tipo').classList.add('hidden');
                document.getElementById('paso-2-metodo').classList.remove('hidden');
                document.getElementById('paso-3-accion').classList.add('hidden');
            }
            lucide.createIcons();
        }

        async function seleccionarMetodo(metodo) {
            metodoActual = metodo;
            document.getElementById('paso-2-metodo').classList.add('hidden');
            document.getElementById('paso-3-accion').classList.remove('hidden');

            const tituloAccion = document.getElementById('titulo-accion');
            const contRostro = document.getElementById('contenedor-rostro');
            const contPin = document.getElementById('contenedor-pin');
            const textoCarga = document.getElementById('texto-carga');
            const iconoCarga = document.getElementById('icono-carga');

            const esIngreso = tipoMarcacionActual === 'INGRESO';
            const colorTexto = esIngreso ? 'text-sky-400' : 'text-rose-400';

            if (metodo === 'ROSTRO') {
                tituloAccion.className = `text-lg sm:text-xl text-center font-black mb-3 tracking-wider uppercase ${colorTexto}`;
                tituloAccion.textContent = `${tipoMarcacionActual} POR RECONOCIMIENTO`;

                contPin.classList.add('hidden');
                contRostro.classList.remove('hidden');

                if (iconoCarga) iconoCarga.classList.remove('hidden');
                if (textoCarga) textoCarga.textContent = "Encendiendo cámara...";

                const ovalo = document.getElementById('ovalo-guia');
                if (ovalo) {
                    ovalo.className = `absolute z-guia border-[3px] border-dashed ${esIngreso ? 'border-sky-400/80' : 'border-rose-400/80'} w-2/3 h-3/4 rounded-[50%] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-[0_0_0_9999px_rgba(15,23,42,0.55)] transition-colors duration-300`;
                }

                await encenderCamara();
                iniciarDeteccionRostros();
            } else {
                tituloAccion.className = `text-lg sm:text-xl text-center font-black mb-3 tracking-wider uppercase ${colorTexto}`;
                tituloAccion.textContent = `${tipoMarcacionActual} POR PIN`;

                contRostro.classList.add('hidden');
                contPin.classList.remove('hidden');
                limpiarPIN();
            }
            lucide.createIcons();
        }

        function reiniciarFlujo() {
            detenerDeteccionRostros();
            apagarCamara();
            limpiarPIN();

            document.getElementById('paso-1-tipo').classList.remove('hidden');
            document.getElementById('paso-2-metodo').classList.add('hidden');
            document.getElementById('paso-3-accion').classList.add('hidden');
            lucide.createIcons();
        }

        // =====================================
        // INTELIGENCIA ARTIFICIAL Y CÁMARA
        // =====================================
        const video = document.getElementById('video-camara');
        const MODEL_URL = 'https://vladmandic.github.io/face-api/model/';
        
        let streamCamara = null;
        let canvasIA = null;
        let intervalDetection = null;
        let modelsLoaded = false;
        
        // Modo Espejo (Por defecto true para movimiento natural tipo espejo frontal)
        let modoEspejo = localStorage.getItem('vt_modo_espejo') !== 'false';

        function aplicarModoEspejo() {
            const transformVal = modoEspejo ? 'scaleX(-1)' : 'scaleX(1)';
            if (video) video.style.transform = transformVal;
            if (canvasIA) canvasIA.style.transform = transformVal;
            const btn = document.getElementById('btn-toggle-espejo');
            if (btn) {
                if (modoEspejo) {
                    btn.classList.add('text-blue-400', 'border-blue-500/40');
                    btn.classList.remove('text-slate-400', 'border-slate-700/60');
                    btn.title = "Modo espejo activado (Movimiento natural: derecha es derecha)";
                } else {
                    btn.classList.remove('text-blue-400', 'border-blue-500/40');
                    btn.classList.add('text-slate-400', 'border-slate-700/60');
                    btn.title = "Modo normal activado (Sin invertir cámara)";
                }
            }
        }

        function toggleModoEspejo() {
            modoEspejo = !modoEspejo;
            localStorage.setItem('vt_modo_espejo', modoEspejo);
            aplicarModoEspejo();
        }
        
        let listaEmpleados = [];
        let faceMatcher = null;

        async function descargarEmpleados() {
            try {
                const respuesta = await fetch(`${API_BASE}/empleados`);
                if (!respuesta.ok) return;
                const datos = await respuesta.json();
                if (Array.isArray(datos) && datos.length > 0) {
                    listaEmpleados = datos;
                    prepararReconocedor();
                }
            } catch (error) {
                console.error("Error conectando con la API:", error);
            }
        }

        function prepararReconocedor() {
            const descriptoresValidos = listaEmpleados.map(emp => {
                if (!emp.face_descriptor) return null;
                let desc = typeof emp.face_descriptor === 'string' ? JSON.parse(emp.face_descriptor) : emp.face_descriptor;
                let floatDescriptors = [];

                if (Array.isArray(desc)) {
                    if (desc.length > 0 && Array.isArray(desc[0])) {
                        floatDescriptors = desc
                            .filter(d => Array.isArray(d) && d.length === 128)
                            .map(d => new Float32Array(d));
                    } else if (desc.length === 128 && typeof desc[0] === 'number') {
                        floatDescriptors = [new Float32Array(desc)];
                    }
                }

                if (floatDescriptors.length > 0) {
                    return new faceapi.LabeledFaceDescriptors(emp.id.toString(), floatDescriptors);
                }
                return null;
            }).filter(d => d !== null);

            if (descriptoresValidos.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(descriptoresValidos, 0.48); 
            }
        }

        async function cargarModelosSilencioso() {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                modelsLoaded = true;
                console.log("Modelos faciales cargados en segundo plano.");
            } catch (error) {
                console.error("Error al inicializar modelos de IA:", error);
            }
        }

        async function encenderCamara() {
            try {
                if (streamCamara) return;
                streamCamara = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 720 } }
                });
                video.srcObject = streamCamara;
                aplicarModoEspejo();
                const iconoCarga = document.getElementById('icono-carga');
                if (iconoCarga) iconoCarga.classList.add('hidden');
            } catch (error) {
                const textoCarga = document.getElementById('texto-carga');
                if (textoCarga) textoCarga.textContent = "Cámara no disponible o bloqueada.";
            }
        }

        function apagarCamara() {
            if (streamCamara) {
                streamCamara.getTracks().forEach(track => track.stop());
                streamCamara = null;
            }
        }

        let candidatoMatchId = null;
        let conteoConfirmacion = 0;
        const CONFIRMACIONES_REQUERIDAS = 2;

        async function iniciarDeteccionRostros() {
            if (!modelsLoaded || !video.srcObject) return;

            if (!canvasIA) {
                canvasIA = faceapi.createCanvasFromMedia(video);
                canvasIA.id = "canvas-ia";
                document.getElementById('contenedor-rostro').appendChild(canvasIA);
            }
            aplicarModoEspejo();
            
            const iconoCarga = document.getElementById('icono-carga');
            const ovalo = document.getElementById('ovalo-guia');
            const mensajeRostro = document.getElementById('mensaje-rostro');
            const displaySize = { width: video.offsetWidth || 350, height: video.offsetHeight || 350 };
            faceapi.matchDimensions(canvasIA, displaySize);

            if (intervalDetection) clearInterval(intervalDetection);

            intervalDetection = setInterval(async () => {
                if (marcacionEnProceso || metodoActual !== 'ROSTRO') return; 

                const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
                const result = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();

                canvasIA.getContext('2d').clearRect(0, 0, canvasIA.width, canvasIA.height);

                if (result) {
                    if (iconoCarga && !iconoCarga.classList.contains('hidden')) {
                        iconoCarga.classList.add('hidden');
                    }

                    const resizedResult = faceapi.resizeResults(result, displaySize);
                    const colorDeteccion = tipoMarcacionActual === 'INGRESO' ? '#38bdf8' : '#f43f5e';
                    faceapi.draw.drawDetections(canvasIA, resizedResult, { withScore: false, color: colorDeteccion });
                    faceapi.draw.drawFaceLandmarks(canvasIA, resizedResult, { color: '#ffffff', lineWidth: 1 });

                    const box = result.detection.box;
                    const centerRostroX = box.x + box.width / 2;
                    const centerRostroY = box.y + box.height / 2;
                    const centerIdealeX = (video.videoWidth || 720) / 2;
                    const centerIdealeY = (video.videoHeight || 720) / 2;
                    
                    const distToleranceX = (video.videoWidth || 720) * 0.28; 
                    const distToleranceY = (video.videoHeight || 720) * 0.28;
                    const minFaceWidth = (video.videoWidth || 720) * 0.16;

                    const estaCentrado = Math.abs(centerRostroX - centerIdealeX) < distToleranceX &&
                                         Math.abs(centerRostroY - centerIdealeY) < distToleranceY &&
                                         box.width > minFaceWidth;

                    if (estaCentrado) {
                        ovalo.classList.replace('border-blue-500/70', 'border-green-500');
                        ovalo.classList.replace('border-red-500/70', 'border-green-500');
                        ovalo.classList.replace('border-sky-400/80', 'border-green-500');
                        ovalo.classList.replace('border-rose-400/80', 'border-green-500');
                        mensajeRostro.classList.add('text-green-300');

                        if (faceMatcher) {
                            const coincidencia = faceMatcher.findBestMatch(result.descriptor);
                            if (coincidencia.label !== "unknown") {
                                if (coincidencia.label === candidatoMatchId) {
                                    conteoConfirmacion++;
                                } else {
                                    candidatoMatchId = coincidencia.label;
                                    conteoConfirmacion = 1;
                                }

                                const emp = listaEmpleados.find(e => e.id.toString() === coincidencia.label);
                                const empNombre = emp ? emp.nombre_completo : 'Empleado';

                                if (conteoConfirmacion >= CONFIRMACIONES_REQUERIDAS) {
                                    mensajeRostro.textContent = `¡Rostro Identificado! (${empNombre})`;
                                    mensajeRostro.classList.add('text-green-300');
                                    candidatoMatchId = null;
                                    conteoConfirmacion = 0;
                                    registrarAsistencia(coincidencia.label, 'ROSTRO');
                                } else {
                                    mensajeRostro.textContent = `Verificando identidad...`;
                                    mensajeRostro.classList.add('text-green-300');
                                }
                            } else {
                                candidatoMatchId = null;
                                conteoConfirmacion = 0;
                                mensajeRostro.textContent = "Rostro no registrado en el sistema";
                                mensajeRostro.classList.remove('text-green-300');
                            }
                        } else {
                            mensajeRostro.textContent = "¡Rostro centrado! (Sin empleados en base de datos)";
                        }
                    } else {
                        candidatoMatchId = null;
                        conteoConfirmacion = 0;
                        restaurarOvalo();
                        mensajeRostro.textContent = "Centra tu rostro en el óvalo";
                        mensajeRostro.classList.remove('text-green-300');
                    }
                } else {
                    candidatoMatchId = null;
                    conteoConfirmacion = 0;
                    restaurarOvalo();
                    mensajeRostro.textContent = "Buscando rostro... Asegúrate de tener buena luz";
                    mensajeRostro.classList.remove('text-green-300');
                }
            }, 250); 
        }

        function restaurarOvalo() {
            const ovalo = document.getElementById('ovalo-guia');
            if (!ovalo) return;
            ovalo.classList.remove('border-green-500');
            if (tipoMarcacionActual === 'INGRESO') {
                ovalo.classList.add('border-sky-400/80');
            } else {
                ovalo.classList.add('border-rose-400/80');
            }
        }

        function detenerDeteccionRostros() {
            candidatoMatchId = null;
            conteoConfirmacion = 0;
            if (intervalDetection) {
                clearInterval(intervalDetection);
                intervalDetection = null;
            }
            if (canvasIA) {
                canvasIA.getContext('2d').clearRect(0, 0, canvasIA.width, canvasIA.height);
            }
        }

        // =====================================
        // TECLADO PIN
        // =====================================
        let pinIngresado = "";
        
        function presionarPIN(numero) {
            if (marcacionEnProceso) return;
            if (pinIngresado.length < 4) {
                pinIngresado += numero;
                actualizarPuntosPIN();
                if (pinIngresado.length === 4) {
                    procesarMarcacionPIN();
                }
            }
        }

        async function procesarMarcacionPIN() {
            marcacionEnProceso = true;
            const pinAValidar = pinIngresado;
            limpiarPIN();

            try {
                const respuesta = await fetch(`${API_BASE}/asistencia/pin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        pin: pinAValidar, 
                        tipo: tipoMarcacionActual 
                    })
                });

                const resultado = await respuesta.json();
                if (respuesta.ok) {
                    mostrarNotificacion(
                        'success', 
                        `¡${resultado.tipo} Registrado!`, 
                        `${resultado.nombre} &bull; ${resultado.mensaje || 'Asistencia confirmada'}`
                    );
                    setTimeout(() => {
                        reiniciarFlujo();
                    }, 2500);
                } else {
                    mostrarNotificacion('error', 'Atención', resultado.error || 'PIN incorrecto');
                    limpiarPIN();
                }
            } catch (error) {
                mostrarNotificacion('error', 'Error de Conexión', 'No se pudo contactar al servidor.');
                limpiarPIN();
            } finally {
                setTimeout(() => {
                    marcacionEnProceso = false;
                }, 2500);
            }
        }

        function borrarPIN() { 
            if (pinIngresado.length > 0) {
                pinIngresado = pinIngresado.slice(0, -1); 
                actualizarPuntosPIN(); 
            }
        }

        function limpiarPIN() { 
            pinIngresado = ""; 
            actualizarPuntosPIN(); 
        }

        function actualizarPuntosPIN() {
            const puntos = document.querySelectorAll('.dot-pin');
            puntos.forEach((punto, index) => {
                if (index < pinIngresado.length) {
                    punto.classList.remove('bg-slate-800', 'border-slate-700');
                    punto.classList.add('bg-blue-500', 'border-blue-400', 'scale-125', 'shadow-[0_0_10px_rgba(59,130,246,0.8)]');
                } else {
                    punto.classList.remove('bg-blue-500', 'border-blue-400', 'scale-125', 'shadow-[0_0_10px_rgba(59,130,246,0.8)]');
                    punto.classList.add('bg-slate-800', 'border-slate-700');
                }
            });
        }

        // Teclado físico para pruebas o terminales táctiles
        window.addEventListener('keydown', (e) => {
            if (metodoActual !== 'PIN') return;
            if (e.key >= '0' && e.key <= '9') {
                presionarPIN(e.key);
            } else if (e.key === 'Backspace') {
                borrarPIN();
            } else if (e.key === 'Escape') {
                limpiarPIN();
            }
        });

        // =====================================
        // ENVÍO DE ASISTENCIA Y NOTIFICACIONES
        // =====================================
        async function registrarAsistencia(empleadoId, metodo) {
            marcacionEnProceso = true; 
            try {
                const respuesta = await fetch(`${API_BASE}/asistencia`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        empleado_id: empleadoId, 
                        metodo: metodo, 
                        tipo: tipoMarcacionActual 
                    })
                });

                const resultado = await respuesta.json();
                if (respuesta.ok) {
                    mostrarNotificacion(
                        'success', 
                        `¡${resultado.tipo} Registrado!`, 
                        `${resultado.nombre} &bull; ${resultado.mensaje || 'Asistencia confirmada'}`
                    );
                    setTimeout(() => {
                        reiniciarFlujo();
                    }, 2500);
                } else {
                    mostrarNotificacion('error', 'Atención', resultado.error || 'Verifica tu estado');
                    restaurarOvalo();
                }
            } catch (error) {
                mostrarNotificacion('error', 'Error de Conexión', 'No se pudo contactar al servidor de asistencia.');
            } finally {
                setTimeout(() => {
                    marcacionEnProceso = false;
                    restaurarOvalo();
                }, 3000);
            }
        }

        let toastTimer = null;
        function mostrarNotificacion(tipo, titulo, mensaje) {
            const toast = document.getElementById('toast-notificacion');
            const toastIcono = document.getElementById('toast-icono');
            const toastTitulo = document.getElementById('toast-titulo');
            const toastMensaje = document.getElementById('toast-mensaje');

            if (tipo === 'success') {
                toast.className = "fixed inset-x-4 top-6 max-w-sm mx-auto z-50 p-4 rounded-2xl border border-emerald-500/50 bg-slate-900/95 shadow-[0_10px_35px_rgba(16,185,129,0.3)] backdrop-blur-md anim-pop flex items-start gap-3";
                toastIcono.className = "p-2 rounded-xl bg-emerald-500/20 text-emerald-400 shrink-0";
                toastIcono.innerHTML = '<i data-lucide="check-circle-2" class="w-6 h-6"></i>';
                toastTitulo.className = "font-bold text-sm text-emerald-300";
            } else {
                toast.className = "fixed inset-x-4 top-6 max-w-sm mx-auto z-50 p-4 rounded-2xl border border-rose-500/50 bg-slate-900/95 shadow-[0_10px_35px_rgba(244,63,94,0.3)] backdrop-blur-md anim-pop flex items-start gap-3";
                toastIcono.className = "p-2 rounded-xl bg-rose-500/20 text-rose-400 shrink-0";
                toastIcono.innerHTML = '<i data-lucide="alert-triangle" class="w-6 h-6"></i>';
                toastTitulo.className = "font-bold text-sm text-rose-300";
            }

            toastTitulo.textContent = titulo;
            toastMensaje.innerHTML = mensaje;
            lucide.createIcons();

            toast.classList.remove('hidden');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 4000);
        }

        // =====================================
        // INICIALIZACIÓN AL CARGAR
        // =====================================
        window.addEventListener('load', async () => {
            aplicarModoEspejo();
            await descargarEmpleados();    
            await cargarModelosSilencioso(); 
        });
    </script>
</body>
